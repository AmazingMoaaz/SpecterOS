<svg width="660" height="180" viewBox="0 0 660 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpecterOS - 2.4 GHz RF Jammer, version 2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="660" height="180" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="658" height="178" rx="21" fill="none" stroke="url(#accent)" stroke-opacity="0.4"/>

  <circle cx="110" cy="92" r="82" fill="url(#glow)"/>

  <!-- RF emission arcs -->
  <g fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round">
    <path d="M148 66 a36 36 0 0 1 0 52"/>
    <path d="M160 52 a54 54 0 0 1 0 80"/>
    <path d="M72 66 a36 36 0 0 0 0 52"/>
    <path d="M60 52 a54 54 0 0 0 0 80"/>
  </g>

  <!-- specter -->
  <path d="M80 118 V76 a30 30 0 0 1 60 0 V118 q-7.5 8 -15 0 q-7.5 8 -15 0 q-7.5 8 -15 0 q-7.5 8 -15 0 Z" fill="#eef2f7"/>
  <circle cx="100" cy="88" r="6" fill="#0b1020"/>
  <circle cx="120" cy="88" r="6" fill="#0b1020"/>
  <circle cx="101.6" cy="86.4" r="1.8" fill="#22d3ee"/>
  <circle cx="121.6" cy="86.4" r="1.8" fill="#22d3ee"/>

  <!-- wordmark -->
  <text x="214" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="1">SPECTER<tspan fill="url(#accent)">OS</tspan></text>
  <text x="216" y="118" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#94a3b8" letter-spacing="4">2.4 GHz RF JAMMER</text>

  <!-- badges -->
  <rect x="216" y="132" width="52" height="27" rx="13.5" fill="none" stroke="url(#accent)"/>
  <text x="242" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#22d3ee">v2</text>
  <rect x="276" y="132" width="192" height="27" rx="13.5" fill="none" stroke="#334155"/>
  <text x="372" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">2x NRF24 · DUAL-CORE</text>
</svg>
